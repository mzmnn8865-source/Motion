<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ذرات</title>
<style>
:root{--bg:#06040c;--dot:#ffffff55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06040c}}
:root[data-theme="dark"]{--bg:#06040c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#v{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#000 100%)}
#d{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:9px;justify-content:center;pointer-events:none}
#d i{width:5px;height:5px;border-radius:50%;background:var(--dot);transition:all .6s}
#h{position:fixed;left:0;right:0;bottom:calc(40px + env(safe-area-inset-bottom,0px));text-align:center;color:#ffffffcc;font:15px/1.6 system-ui,sans-serif;letter-spacing:.02em;pointer-events:none;transition:opacity 1.2s;animation:b 2.4s ease-in-out infinite}@keyframes b{50%{color:#ffffff66}}
#d i.on{background:#fff;transform:scale(1.7)}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="v"></div><div id="d"></div><div id="h">برای شروع موسیقی لمس کنید ♪</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),rnd=Math.random,TAU=Math.PI*2,sin=Math.sin,cos=Math.cos;
let W,H,S,DPR;
function fit(){DPR=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;S=Math.min(W,H)*.47;g.fillStyle='#06040c';g.fillRect(0,0,W,H)}
addEventListener('resize',fit);fit();
const N=innerWidth<700?7500:11000;

/* ابزار رسم */
let L;const pt=(x,y,c)=>L.push([x,y,c[0],c[1],c[2]]);
const hsl=(h,s,l)=>{h=((h%360)+360)%360/360;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h*12)%12;return(l-a*Math.max(-1,Math.min(k-3,9-k,1)))*255};return[f(0),f(8),f(4)]};
function chaikin(p,cl,it){while(it--){const q=[],m=p.length;for(let i=0;i<(cl?m:m-1);i++){const a=p[i],b=p[(i+1)%m];q.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75])}if(!cl){q.unshift(p[0]);q.push(p[m-1])}p=q}return p}
function trace(p,n,c,cl,it){p=chaikin(p,cl,it==null?3:it);if(cl)p=p.concat([p[0]]);let tot=0;const d=[0];for(let i=1;i<p.length;i++){tot+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);d.push(tot)}
 for(let k=0;k<n;k++){const s=rnd()*tot;let lo=1,hi=d.length-1;while(lo<hi){const m=(lo+hi)>>1;d[m]<s?lo=m+1:hi=m}const f=(s-d[lo-1])/((d[lo]-d[lo-1])||1);pt(p[lo-1][0]+(p[lo][0]-p[lo-1][0])*f,p[lo-1][1]+(p[lo][1]-p[lo-1][1])*f,typeof c==='function'?c(s/tot):c)}}

/* ۱) هزارتو */
const R=13,gaps=[],om=[];
for(let k=0;k<R;k++){gaps.push(Array.from({length:2+(k%2)},()=>rnd()*TAU));om.push((k&1?1:-1)*(.12+.034*k))}
const mk=new Uint8Array(N),ma=new Float32Array(N),mu=new Float32Array(N),msp=new Uint8Array(N);
for(let i=0;i<N;i++){const k=Math.min(R-1,Math.floor(Math.sqrt(rnd())*R));mk[i]=k;
 if(rnd()<.2){msp[i]=1;ma[i]=gaps[k][Math.floor(rnd()*gaps[k].length)]+(rnd()-.5)*.05;mu[i]=rnd()}
 else{let a;do{a=rnd()*TAU}while(gaps[k].some(q=>{let d=Math.abs(((a-q+Math.PI*3)%TAU)-Math.PI);return d>Math.PI-.22}));ma[i]=a}}

/* ۲) گل: ۱۴ لایه گلبرگ، رگبرگ، پرچم، برگ‌های حاشیه و گرده */
function flower(){L=[];const J=14;
 for(let j=0;j<J;j++){const u=j/(J-1),Rj=.92-u*.78,m=[6,8,7,9][j%4],ph=j*.61,n=j<3?900:620,P=th=>.42+.58*Math.pow(Math.abs(cos(m*th/2+ph)),.65);
  for(let k=0;k<n;k++){const th=rnd()*TAU,e=Math.pow(rnd(),1.7),rr=Rj*P(th)*(1-.62*e);
   pt(rr*cos(th),rr*sin(th),hsl(338-u*26+e*22,.88,.36+.3*e+.26*(1-u)))}
  for(let k=0;k<110;k++){const th=rnd()*TAU,r=Rj*P(th);pt(r*cos(th),r*sin(th),hsl(345-u*30,.55,.9))}
  for(let k=0;k<70;k++){const q=Math.floor(rnd()*m),th=2*(Math.PI*q-ph)/m,r=.1+rnd()*Rj*.95,w=.03*sin(r*9+j);pt(r*cos(th+w),r*sin(th+w),hsl(350-u*20,.7,.82))}}
 for(let i=0;i<950;i++){const a=i*2.39996,r=.13*Math.sqrt(i/950);pt(r*cos(a),r*sin(a),hsl(52-i/950*22,.95,.5+.2*rnd()))}
 for(let i=0;i<46;i++){const a=rnd()*TAU,r2=.17+rnd()*.1,bx=cos(a),by=sin(a);
  trace([[.1*bx,.1*by],[(.14+r2)/2*bx+.02*sin(i),(.14+r2)/2*by],[r2*bx,r2*by]],14,hsl(40,.9,.6),false,2);
  for(let k=0;k<5;k++)pt(r2*bx+(rnd()-.5)*.012,r2*by+(rnd()-.5)*.012,[255,230,140])}
 for(let i=0;i<22;i++){const a=i/22*TAU+.07,ux=cos(a),uy=sin(a),cx=.99*ux,cy=.99*uy,P=[];
  for(let q=0;q<10;q++){const t=q/10*TAU,al=cos(t)*.1,be=sin(t)*.036*(1-.2*cos(t));P.push([cx+al*ux-be*uy,cy+al*uy+be*ux])}
  trace(P,70,t=>hsl(120+t*50,.55,.35+.25*t),true)}
 for(let i=0;i<420;i++){const a=rnd()*TAU,r=1.07+Math.pow(rnd(),2.5)*.08;pt(r*cos(a),r*sin(a),i%3?hsl(310+rnd()*60,.9,.78):hsl(48,.95,.72))}
 for(const p of L){p[0]*=.88;p[1]*=.88}
}

/* ۳) درخت */
function tree(){L=[];const seg=[];
 (function br(x,y,a,len,d){if(d>10)return;const x2=x+sin(a)*len,y2=y-cos(a)*len;seg.push([x,y,x2,y2,d]);const sp=.3+rnd()*.28;
  br(x2,y2,a-sp,len*(.73+rnd()*.06),d+1);br(x2,y2,a+sp*(.8+rnd()*.4),len*(.73+rnd()*.06),d+1);if(rnd()<.25&&d>2)br(x2,y2,a+(rnd()-.5)*.9,len*.6,d+1)})(0,.92,0,.3,0);
 for(const s of seg){const n=Math.round(Math.hypot(s[2]-s[0],s[3]-s[1])*(420-s[4]*28)+3),t=s[4]/10;
  trace([[s[0],s[1]],[s[2],s[3]]],n,hsl(26-t*8,.55,.28+t*.25),false,0);
  if(s[4]>=7)for(let k=0;k<(s[4]>8?14:5);k++){const a=rnd()*TAU,r=Math.sqrt(rnd())*.07;pt(s[2]+r*cos(a),s[3]+r*sin(a),rnd()<.7?hsl(335+rnd()*20,.8,.72+rnd()*.15):hsl(95+rnd()*40,.5,.5))}}
 for(let i=0;i<500;i++){const a=rnd()*TAU,r=.2+rnd()*.004;pt(.55+r*cos(a)*.9,-.62+r*sin(a)*.9,hsl(45,.8,.75))}
 for(let i=0;i<500;i++){const x=(rnd()*2-1)*.95;pt(x,.93+rnd()*.015,hsl(330,.5,.6))}
}

 const D=s.d;if(D)for(let i=0;i<16;i++){const tt=t+i*SIX;if(D[0][i]=='k')kick(tt,D[3]);if(D[1][i]=='s'){ns(tt,.2,'bandpass',1800,D[3]*.35);v(tt,190,.1,'triangle',D[3]*.12,{rv:.3})}if(D[2][i]=='h')ns(tt,i%4==2?.14:.04,'highpass',8000,D[3]*.12)}

 document.addEventListener('visibilitychange',()=>document.hidden?AC.suspend():AC.resume())}

/* حلقه */
let sc=0,t0=performance.now(),last=t0;
const dots=document.getElementById('d');for(let i=0;i<10;i++)dots.appendChild(document.createElement('i'));

const buckets=new Map();

  for(let q=0;q<a.length;q++){const i=a[q];g.rect(cx+X[i]*SS,cy+Y[i]*SS,sz,sz)}g.fill()});
